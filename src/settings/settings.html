<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AOWA Agent</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: system-ui, sans-serif; background: #0f1117; color: #e5e7eb;
        display: flex; flex-direction: column; height: 100vh; padding: 1.4rem;
      }
      h1 { font-size: 1.1rem; margin: 0 0 0.2rem; }
      .sub { color: #9ca3af; font-size: 0.8rem; margin: 0 0 1.4rem; }
      .status-card {
        display: flex; align-items: center; gap: 0.7rem; padding: 0.9rem 1rem;
        border: 1px solid #262b36; border-radius: 12px; background: #151824;
      }
      .dot { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: #6b7280; flex: none; }
      .status { font-weight: 600; }
      .detail { color: #9ca3af; font-size: 0.78rem; margin-top: 0.5rem; min-height: 1em; }
      .spacer { flex: 1; }
      .steps { font-size: 0.82rem; color: #cbd5e1; line-height: 1.5; }
      .steps b { color: #e5e7eb; }
      .row { display: flex; gap: 0.6rem; margin-top: 1rem; }
      button {
        flex: 1; padding: 0.65rem 0.9rem; border-radius: 10px; border: 1px solid #2b3242;
        background: #1c2130; color: #e5e7eb; font-size: 0.85rem; cursor: pointer;
      }
      button.primary { background: #7c3aed; border-color: #7c3aed; }
      button:disabled { opacity: 0.4; cursor: default; }
      .manual { margin-top: 1rem; }
      .manual label { display: block; font-size: 0.75rem; color: #9ca3af; margin-bottom: 0.35rem; }
      .manual-row { display: flex; gap: 0.6rem; }
      .manual input {
        flex: 1; padding: 0.6rem 0.7rem; border-radius: 10px; border: 1px solid #2b3242;
        background: #0f1117; color: #e5e7eb; font-size: 0.9rem; font-family: ui-monospace, monospace;
      }
      .manual button { flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <h1>AOWA Agent</h1>
    <p class="sub">Syncs your live Warframe inventory to your AOWA account.</p>

    <div class="status-card">
      <span class="dot" id="dot"></span>
      <span class="status" id="status">…</span>
    </div>
    <p class="detail" id="detail"></p>

    <div class="spacer"></div>

    <p class="steps">
      To link: open <b>AOWA → Profile → Game agent → Link agent</b>. Your browser
      will launch this app and pair it automatically. If it doesn't fire, paste
      the one-time code shown there below.
    </p>

    <div class="manual">
      <label for="code">One-time pairing code</label>
      <div class="manual-row">
        <input id="code" type="text" placeholder="paste code…" autocomplete="off" spellcheck="false" />
        <button class="primary" id="pair">Pair</button>
      </div>
    </div>

    <div class="row">
      <button id="open-aowa">Open AOWA</button>
      <button id="unpair">Unpair</button>
    </div>

    <script type="module" src="./settings.ts"></script>
  </body>
</html>
